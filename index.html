<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPACE SCANNER | GTA EDITION</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@900&family=Space+Grotesk:wght@700&display=swap');

        :root {
            --gta-yellow: #fde02a;
            --gta-blue: #00aaff;
            --neon-pink: #ff00ff;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #000;
            font-family: 'Outfit', sans-serif;
            color: white;
            overflow: hidden;
        }

        /* SPACE ANIME BACKGROUND */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: url('https://wallpaperaccess.com/full/419642.jpg') center/cover;
            opacity: 0.6;
        }

        /* GTA STYLE UI */
        .gta-panel {
            background: rgba(0, 0, 0, 0.9);
            border: 4px solid white;
            padding: 30px;
            width: 350px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 10px 10px 0px var(--gta-yellow);
            text-transform: uppercase;
            z-index: 10;
        }

        .hidden { display: none !important; }

        h1 {
            font-size: 2.2rem;
            font-style: italic;
            -webkit-text-stroke: 1px var(--gta-yellow);
            margin-bottom: 20px;
            line-height: 0.9;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: #111;
            border: 2px solid #444;
            color: white;
            box-sizing: border-box;
        }

        .gta-btn {
            width: 100%;
            padding: 15px;
            background: white;
            color: black;
            border: none;
            font-weight: 900;
            cursor: pointer;
            transition: 0.1s;
        }

        .gta-btn:hover {
            background: var(--gta-yellow);
            transform: skew(-5deg);
        }

        /* LIVE CAMERA TRANSFORMER STYLES */
        #camera-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(1) contrast(1.5) brightness(0.8); /* Anime Noir Style */
        }

        #data-overlay {
            position: absolute;
            top: 20%;
            left: 10%;
            right: 10%;
            bottom: 20%;
            border: 2px solid var(--gta-blue);
            pointer-events: none;
            box-shadow: 0 0 20px var(--gta-blue);
        }

        #live-text-output {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 170, 255, 0.3);
            padding: 20px;
            width: 80%;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            color: var(--gta-yellow);
            text-shadow: 2px 2px black;
            border-left: 8px solid white;
        }

        .nav-ui {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <div id="login-page" class="gta-panel">
        <h1>LOGIN_USER</h1>
        <input type="text" placeholder="NAME">
        <input type="text" placeholder="USERNAME">
        <input type="email" placeholder="EMAIL">
        <input type="password" placeholder="PASSWORD">
        <button class="gta-btn" onclick="startCamera()">INITIATE SCANNER</button>
    </div>

    <div id="scanner-page" class="hidden">
        <div class="nav-ui">
            <button class="gta-btn" style="width: auto; padding: 10px;" onclick="location.reload()">BACK TO HOME</button>
        </div>
        
        <div id="camera-container">
            <video id="video" autoplay playsinline></video>
            <div id="data-overlay"></div>
            <div id="live-text-output">SCANNING OBJECTS...</div>
        </div>
        
        <canvas id="canvas" class="hidden"></canvas>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const output = document.getElementById('live-text-output');
        const loginPage = document.getElementById('login-page');
        const scannerPage = document.getElementById('scanner-page');

        // 1. START CAMERA
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                video.srcObject = stream;
                loginPage.classList.add('hidden');
                scannerPage.classList.remove('hidden');
                
                // Start the OCR Loop
                setInterval(captureAndProcess, 2000); // Scans every 2 seconds
            } catch (err) {
                alert("Camera access denied or not found!");
            }
        }

        // 2. CAPTURE FRAME & TRANSFORM TO TEXT
        async function captureAndProcess() {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Draw current video frame to hidden canvas
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Tesseract Magic
            output.innerText = "TRANSFORMING...";
            
            try {
                const result = await Tesseract.recognize(canvas, 'eng');
                if(result.data.text.trim().length > 0) {
                    output.innerText = result.data.text;
                } else {
                    output.innerText = "NO DATA DETECTED";
                }
            } catch (e) {
                console.error("OCR Error:", e);
            }
        }
    </script>
</body>
</html>
